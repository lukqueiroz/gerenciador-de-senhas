<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gerenciador de senhas</title>
</head>
<body>
    <style>
    body {
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f172a;
font-family:Arial, Helvetica, sans-serif;
    
}
    main{
        max-width: 300px;
        margin: 0 auto; 
       
    }
    .card{
background:#27282b;
width:380px;
padding:30px;
border-radius:16px;
color:#fff;
box-shadow:0 20px 40px rgba(58,86,99,0.4);
display:flex;
flex-direction:column;
align-items:center;
gap:15px; 
    }
   
    h1{
        width: 100%;
        background: linear-gradient(135deg, #65b2be, #18daa9);
        border: none;
        padding: 4px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 22px;
        color: #0f172a;
        transition: transform .2s, box-shadow .2s;
        display: flex;
        justify-content: center;
        
    }
p {
  text-align:center;
  margin:0;

}
   

/* linha */
.slider {
  /* slider */
  --slider-width: 100%;
  --slider-height: 7px;
  --slider-bg: rgb(97, 96, 96);
  --slider-border-radius: 999px;
  /* level */
  --level-color:#18daa9;
  --level-transition-duration: .1s;
  /* icon */
  
  --icon-margin: 60px;
  --icon-color: var(--slider-bg);
  --icon-size: 30px;
  
}

.slider {
width:100%;
display:flex;
align-items:center;

}

.slider .volume {
  display: none;
  vertical-align: top;
  margin-right: var(--icon-margin);
  color: var(--icon-color);
  width: var(--icon-size);
  height: auto;
  
}

.slider .level {
 width:100%;
appearance:none;
height:7px;
background:rgb(97,96,96);
border-radius:999px;
cursor:pointer;
overflow:hidden;
}

.slider .level::-webkit-slider-thumb {
 appearance:none;
width:0;
height:0;
box-shadow:-200px 0 0 200px #18daa9;
}

.slider:hover .level {
height:12px;
}

/* botao de copiar*/
.copy {
  --button-bg: #27282b;
  --button-hover-bg: #464646;
  --button-text-color: #CCCCCC;
  --button-hover-text-color: #8bb9fe;
  --button-border-radius: 10px;
  --button-diameter: 36px;
  --button-outline-width: 1px;
  --button-outline-color: rgb(141, 141, 141);

  --tooltip-bg: #f4f3f3;
  --toolptip-border-radius: 4px;
  --tooltip-font-family: Menlo, Roboto Mono, monospace;

  --tooltip-font-size: 12px;

  --tootip-text-color: rgb(50, 50, 50);
  --tooltip-padding-x: 7px;
  --tooltip-padding-y: 7px;
  --tooltip-offset: 8px;


}

.copy, .generate-btn {
  box-sizing: border-box;
  width: var(--button-diameter);
  height: var(--button-diameter);
  border-radius: var(--button-border-radius);
  box-shadow: 0 0 .4vw rgba(0,0,0,0.5), 0 0 0 .15vw transparent;
  background-color: var(--button-bg);
  color: var(--button-text-color);
  border: none;
  cursor: pointer;
  position: relative;
  outline: none;
  margin-left: 5px;
}



.tooltip {
  position: absolute;
  opacity: 0;
  visibility: 0;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font: var(--tooltip-font-size) var(--tooltip-font-family);
  color: var(--tootip-text-color);
  background: var(--tooltip-bg);
  padding: var(--tooltip-padding-y) var(--tooltip-padding-x);
  border-radius: var(--toolptip-border-radius);
  pointer-events: none;
  transition: all var(--tooltip-transition-duration) cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.tooltip::before {
  content: attr(data-text-initial);
}

.tooltip::after {
  content: "";
  position: absolute;
  bottom: calc(var(--tooltip-padding-y) / 2 * -1);
  width: var(--tooltip-padding-y);
  height: var(--tooltip-padding-y);
  background: inherit;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  z-index: -999;
  pointer-events: none;
}

.copy svg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.checkmark {
  display: none;
}



.copy:hover .tooltip,
.copy:focus:not(:focus-visible) .tooltip {
  opacity: 1;
  visibility: visible;
  top: calc((100% + var(--tooltip-offset)) * -1);
}

.copy:focus:not(:focus-visible) .tooltip::before {
  content: attr(data-text-end);
}

.copy:focus:not(:focus-visible) .clipboard {
  display: none;
}

.copy:focus:not(:focus-visible) .checkmark {
  display: block;
}

.copy:hover,
.copy:focus {
  background-color: var(--button-hover-bg);
}

.copy:active {
  outline: var(--button-outline-width) solid var(--button-outline-color);
}

.copy:hover svg {
  color: var(--button-hover-text-color);
}

/* input area do gerador de senhas*/
   .input {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Oxygen","Ubuntu","Cantarell","Fira Sans","Droid Sans","Helvetica Neue",sans-serif;
  font-weight: 500;
  color: #fff;
  font-size: 15px;
  background-color: #27282b;
  box-shadow: 0 0 .4vw rgba(0,0,0,0.5), 0 0 0 .15vw transparent;
  border-radius: 0.4vw;
  border: 1px solid transparent;
  outline: none;
  padding: 0.4vw;
  width: 100%;
  transition: .4s;
}

.input:hover {
  box-shadow: 0 0 0 .15vw rgba(135, 207, 235, 0.186);
}

   .security .bar {
    height: 10px;
    border-top-right-radius: 8px;
    border-bottom-left-radius:8px;
    border-bottom-right-radius: 8px;
    
    transition: all 0.2s;
   }
  
.config-options{
display: flex;
justify-content: center;

}
.size{
  font-size: 15px;
  justify-content: center;
}




</style>

    <div class="card">
        <h1>Gerenciador De Senhas</h1>
        <p>Utilize o nosso gerador online para criar uma senha forte e seguro</p>
        
        <section class="box config">
            <div class="customize">
               
                <div class="actions">
                    <div class="passaword-length">
                        <div class="size"><p>Tamanho: <span id="passaword-length-text">16</span></p></div>
                        <label class="slider"><!--linha--> 
                            <input type="range" name="password-length" id="password-length" value="16" min="6" max="64" class="level">
                            <svg class="volume" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0" viewBox="0 0 24 24" style="enable-background:new 0 0 512 512" xml:space="preserve"></svg>
                       </label>
                    </div>
                   
                     <div class="password-section">
                <div class="text" style="display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center;"> 
                    <div style="display: flex; gap: 8px; width: 100%; max-width: 400px; align-items: center;">
                        <input 
                            placeholder="Write a message"
                            class="input"
                            type="text" 
                            name="password" 
                            id="password"
                            style="flex: 1; box-sizing: border-box;">
                        
                        <button id="Copiar" class="copy">
                            <span data-text-end="Copiado!" data-text-initial="Copiar para a área de transferência" class="tooltip"></span>
                            <span>
                                <svg xml:space="preserve" style="enable-background:new 0 0 512 512" viewBox="0 0 6.35 6.35" y="0" x="0" height="20" width="20" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg" class="clipboard">
                                    <g>
                                        <path fill="currentColor" d="M2.43.265c-.3 0-.548.236-.573.53h-.328a.74.74 0 0 0-.735.734v3.822a.74.74 0 0 0 .735.734H4.82a.74.74 0 0 0 .735-.734V1.529a.74.74 0 0 0-.735-.735h-.328a.58.58 0 0 0-.573-.53zm0 .529h1.49c.032 0 .049.017.049.049v.431c0 .032-.017.049-.049.049H2.43c-.032 0-.05-.017-.05-.049V.843c0-.032.018-.05.05-.05zm-.901.53h.328c.026.292.274.528.573.528h1.49a.58.58 0 0 0 .573-.529h.328a.2.2 0 0 1 .206.206v3.822a.2.2 0 0 1-.206.205H1.53a.2.2 0 0 1-.206-.205V1.529a.2.2 0 0 1 .206-.206z"></path>
                                    </g>
                                </svg>
                                <svg xml:space="preserve" style="enable-background:new 0 0 512 512" viewBox="0 0 24 24" y="0" x="0" height="18" width="18" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg" class="checkmark">
                                    <g>
                                        <path data-original="#000000" fill="currentColor" d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z"></path>
                                    </g>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <div class="security-indicator" style="width: 100%; max-width: 400px;">
                        <div id="security-indicator-bar" class="bar" style="width: 90%;"></div>
                    </div>
                </div>
                 <div class="config-options">
                        <label class="checkbox-container">
                            <span class="text">Maiúsculas</span>
                            <input type="checkbox" id="uppercase-check" checked/>
                            <span class="checkmark"></span>
                        </label>
                        <label class="checkbox-container">
                            <span class="text">Números</span>
                            <input type="checkbox" id="numbers-check" checked/>
                            <span class="checkmark"></span>
                        </label>
                        <label class="checkbox-container">
                            <span class="text">Símbolos</span>
                            <input type="checkbox" id="symbol-check" checked/>
                            <span class="checkmark"></span>
                        </label>
                    </div>
               </div>
            </div>
         </div>
     </div>
  </section>
   
    <script>
        let passwordLength = 16
        
        const inputEl = document.getElementById("password")

        const upperCaseCheckEl = document.getElementById("uppercase-check")
        const numberCheckEl = document.getElementById("numbers-check")
        const symbolCheckEl = document.getElementById("symbol-check")
        
      
        function generatePassword() {
            let chars = "abcdfghjklmnopqrstuvwxyz"

            const upperCaseChars = "ABCDFGHIJKLMNOPQRSTUVWXYZ"
            const numberChars = "123456789"
            const symbolChars = "?!@&()[]"

            if(upperCaseCheckEl.checked){
            chars += upperCaseChars
            }

            if (numberCheckEl.checked){
            chars += numberChars    
            }

            if(symbolCheckEl.checked){
            chars += symbolChars
            }
            
            let password = ""

            for(let i= 0; i < passwordLength; i++) {
                const randomnumber = Math.floor(Math.random() * chars.length)
                password += chars.substring(randomnumber, randomnumber + 1)
            }
            
            inputEl.value = password
            
        }
        function Copiar(){
          navigator.clipboard.writeText(inputEl.value)
        }
        
        const passwordLengthEl = document.getElementById("password-length")
        passwordLengthEl.addEventListener('input', function () {
            passwordLength = passwordLengthEl.value
            document.getElementById("passaword-length-text").innerText = passwordLength
            generatePassword()
        })
        upperCaseCheckEl.addEventListener("click", generatePassword) 
        numberCheckEl.addEventListener("click", generatePassword) 
        symbolCheckEl.addEventListener("click", generatePassword)

        const CopiarButtonEl = document.getElementById("Copiar")
        CopiarButtonEl.addEventListener("click", Copiar)
        
        generatePassword()

    </script>
</body>
</html>
